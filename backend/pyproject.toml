[tool.poetry]
name = "locus-ai-backend"
version = "0.1.0"
description = "Locus AI - Decision Intelligence Backend"
authors = ["Locus AI Team"]
package-mode = false

[tool.poetry.dependencies]
python          = "^3.12"
fastapi         = "^0.115"
uvicorn         = { version = "^0.30", extras = ["standard"] }
supabase        = "^2.0"          # supabase-py client
asyncpg         = "^0.29"         # async Postgres driver
pydantic        = "^2.7"          # data validation / schemas
pydantic-settings = "^2.2"        # settings from .env
anthropic       = "^0.25"         # Claude Haiku + Sonnet
openai          = "^1.30"         # OpenAI (alternative provider)
voyageai        = "^0.2"          # Voyage embeddings
stripe          = "^9.0"          # Stripe billing
python-jose     = { version = "^3.3", extras = ["cryptography"] }  # JWT
cryptography    = "^42"           # AES-GCM encryption
apscheduler     = "^3.10"         # Cron jobs
httpx           = "^0.27"         # Async HTTP client
tenacity        = "^8.3"          # Retry logic
python-dotenv   = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest          = "^8"
pytest-asyncio  = "^0.23"
pytest-cov      = "^5"
ruff            = "^0.4"          # Linter + formatter
mypy            = "^1.10"
httpx           = "^0.27"         # Test client

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
select      = ["E", "F", "I", "N", "UP"]

[tool.mypy]
python_version        = "3.12"
strict                = true
ignore_missing_imports = true
